name: Error
description: Reportar un problema de la aplicación.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Qué ocurre y qué debería ocurrir.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Entorno
      description: Versión de la app, dispositivo y sistema operativo.
    validations:
      required: true
