name: Cambio
description: Definir una mejora o tarea.
body:
  - type: textarea
    id: purpose
    attributes:
      label: Objetivo
      description: Necesidad que atiende y evidencia disponible.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Alcance
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterio de aceptación
      description: Cómo se comprobará que el cambio está completo.
    validations:
      required: true
