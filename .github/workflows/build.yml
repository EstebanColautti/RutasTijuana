name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Comprobaciones
        type: choice
        options: [full, native]
        default: full

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Selección
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web: ${{ steps.select.outputs.web }}
      native: ${{ steps.select.outputs.native }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          CHECK_MODE: ${{ inputs.mode || 'full' }}
        run: python3 scripts/ci_select.py
      - name: Configuración
        run: |
          git show --format= --check HEAD
          python3 -m unittest discover -s tests -p test_ci.py

  web:
    name: Herramientas y panel
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      seconds: ${{ steps.elapsed.outputs.seconds }}
    steps:
      - id: begin
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.1
      - name: pnpm
        run: |
          npm install --global pnpm@11.25.0
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-node24.22.1-pnpm11.25.0-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
      - name: Pruebas
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/catalog-preview.test.cjs
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
      - id: elapsed
        if: always()
        env:
          STARTED: ${{ steps.begin.outputs.started }}
        run: echo "seconds=$(($(date +%s)-STARTED))" >> "$GITHUB_OUTPUT"

  native:
    name: Lógica y Release
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.native == 'true' }}
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    outputs:
      seconds: ${{ steps.elapsed.outputs.seconds }}
    steps:
      - id: begin
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Lógica
        run: bash scripts/test-logic.sh
      - name: Release
        run: |
          set -o pipefail
          xcodebuild -project RutasTijuana.xcodeproj -scheme RutasTijuana -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/Release" CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build 2>&1 | tee "$RUNNER_TEMP/release.log"
          python3 scripts/check_app_bundle.py "$RUNNER_TEMP/Release/Build/Products/Release-iphonesimulator/RutasTijuana.app"
      - id: elapsed
        if: always()
        env:
          STARTED: ${{ steps.begin.outputs.started }}
        run: echo "seconds=$(($(date +%s)-STARTED))" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: Release-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release.log
          retention-days: 7

  ui:
    name: Interfaz iPhone
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.native == 'true' }}
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    outputs:
      seconds: ${{ steps.elapsed.outputs.seconds }}
    steps:
      - id: begin
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preparar simulador
        run: |
          simulator=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(v["udid"] for k in sorted(d, reverse=True) if "iOS-18" in k for v in d[k] if "iPhone" in v["name"]))')
          echo "SIMULATOR=$simulator" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator"
      - name: Compilar pruebas
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project RutasTijuana.xcodeproj -scheme RutasTijuana -destination "platform=iOS Simulator,id=$SIMULATOR" -derivedDataPath "$RUNNER_TEMP/UITestBuild" CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee "$RUNNER_TEMP/ui-build.log"
          python3 scripts/check_app_bundle.py "$RUNNER_TEMP/UITestBuild/Build/Products/Debug-iphonesimulator/RutasTijuana.app"
      - name: Interfaz
        run: |
          set -o pipefail
          xcrun simctl bootstatus "$SIMULATOR" -b
          xcodebuild test-without-building -project RutasTijuana.xcodeproj -scheme RutasTijuana -destination "platform=iOS Simulator,id=$SIMULATOR" -derivedDataPath "$RUNNER_TEMP/UITestBuild" -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/UITests.xcresult" CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/ui-tests.log"
      - name: Capturas y resumen
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/UITests.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/UITests.xcresult" > "$RUNNER_TEMP/ui-summary.json"
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/UITests.xcresult" --output-path "$RUNNER_TEMP/ui-captures"
            python3 scripts/ci_ui_summary.py "$RUNNER_TEMP/ui-summary.json" "$GITHUB_STEP_SUMMARY"
          fi
      - id: elapsed
        if: always()
        env:
          STARTED: ${{ steps.begin.outputs.started }}
        run: echo "seconds=$(($(date +%s)-STARTED))" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: iPhone-tests-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/UITests.xcresult
            ${{ runner.temp }}/ui-*.log
            ${{ runner.temp }}/ui-summary.json
            ${{ runner.temp }}/ui-captures
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: iPhone-captures-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ui-captures
            ${{ runner.temp }}/ui-summary.json
          retention-days: 7

  result:
    name: Resultado
    needs: [changes, web, native, ui]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Resumen
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_summary.py
