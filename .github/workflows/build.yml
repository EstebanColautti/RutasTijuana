name: Build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      mode:
        description: Comprobaciones
        type: choice
        options: [full, native, walking, package]
        default: full
      public_key:
        description: Clave pública para los resultados
        type: string
      catalog_package:
        description: Catálogo en ZIP codificado en base64 (opcional)
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'package' }}
    uses: ./.github/workflows/compilacion.yml

  walking:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'walking' }}
    uses: ./.github/workflows/walking.yml
    with:
      public_key: ${{ inputs.public_key }}
      catalog_package: ${{ inputs.catalog_package }}

  changes:
    name: Selección
    if: ${{ inputs.mode != 'walking' && inputs.mode != 'package' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web: ${{ steps.select.outputs.web }}
      native: ${{ steps.select.outputs.native }}
      ui: ${{ steps.select.outputs.ui }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          CHECK_MODE: ${{ inputs.mode || 'full' }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: python3 scripts/ci_select.py
      - name: Configuración
        run: |
          git show --format= --check HEAD
          python3 -m unittest discover -s tests -p test_ci.py

  web:
    name: Herramientas y panel
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      seconds: ${{ steps.elapsed.outputs.seconds }}
    steps:
      - id: begin
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: pnpm
        run: |
          npm install --global pnpm@11.25.0
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-node24.22.1-pnpm11.25.0-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
      - name: Pruebas
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/catalog-preview.test.cjs
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
          npx --yes --package=deno@2.9.6 deno check --no-config --node-modules-dir=none --lock=supabase/functions/deno.lock --frozen supabase/functions/catalog/index.ts supabase/functions/team/index.ts
          npx --yes --package=deno@2.9.6 deno test --no-config --node-modules-dir=none --lock=supabase/functions/deno.lock --frozen --allow-env tests/functions_test.ts
      - id: elapsed
        if: always()
        env:
          STARTED: ${{ steps.begin.outputs.started }}
        run: echo "seconds=$(($(date +%s)-STARTED))" >> "$GITHUB_OUTPUT"

  native:
    name: Lógica y Release
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.native == 'true' }}
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    outputs:
      seconds: ${{ steps.elapsed.outputs.seconds }}
    steps:
      - id: begin
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lógica
        run: bash scripts/test-logic.sh
      - name: Release
        run: |
          set -o pipefail
          xcodebuild -project RutasTijuana.xcodeproj -scheme RutasTijuana -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/Release" CATALOG_FIXTURE=NO CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build 2>&1 | tee "$RUNNER_TEMP/release.log"
          python3 scripts/check_app_bundle.py "$RUNNER_TEMP/Release/Build/Products/Release-iphonesimulator/RutasTijuana.app"
      - id: elapsed
        if: always()
        env:
          STARTED: ${{ steps.begin.outputs.started }}
        run: echo "seconds=$(($(date +%s)-STARTED))" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: Release-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release.log
          retention-days: 7

  ui:
    name: Interfaz iPhone
    needs: changes
    # En borradores solo corren lógica, Release y panel; el iPhone corre al marcar el PR como listo.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.ui == 'true' }}
    runs-on: ${{ matrix.device == 'compact' && 'macos-15' || 'macos-26' }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        device: [standard, compact]
    env:
      DEVELOPER_DIR: ${{ matrix.device == 'compact' && '/Applications/Xcode_16.4.app/Contents/Developer' || '/Applications/Xcode.app/Contents/Developer' }}
    outputs:
      seconds: ${{ steps.elapsed.outputs.seconds }}
    steps:
      - id: begin
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar simulador
        env:
          PROFILE: ${{ matrix.device }}
        run: |
          if [ "$PROFILE" = compact ]; then
            runtime=com.apple.CoreSimulator.SimRuntime.iOS-17-5
            if ! xcrun simctl list runtimes available | grep -Fq "$runtime"; then
              xcodebuild -downloadPlatform iOS -buildVersion 17.5
            fi
            simulator=$(xcrun simctl create "iPhone SE" com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation "$runtime")
          else
            simulator=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(v["udid"] for k in sorted(d, reverse=True) if "iOS-26" in k for v in d[k] if v["name"] == "iPhone 17"))')
          fi
          echo "SIMULATOR=$simulator" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b
      - name: Compilar pruebas
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project RutasTijuana.xcodeproj -scheme RutasTijuana -destination "platform=iOS Simulator,id=$SIMULATOR" -derivedDataPath "$RUNNER_TEMP/UITestBuild" CATALOG_FIXTURE=YES CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee "$RUNNER_TEMP/ui-build.log"
          python3 scripts/check_app_bundle.py "$RUNNER_TEMP/UITestBuild/Build/Products/Debug-iphonesimulator/RutasTijuana.app"
          python3 scripts/install_catalog.py --source Catalog --destination "$RUNNER_TEMP/UITestBuild/Build/Products/Debug-iphonesimulator/RutasTijuana.app/Full/Catalog.bundle"
      - name: Interfaz
        run: |
          set -o pipefail
          xcrun simctl bootstatus "$SIMULATOR" -b
          xcodebuild test-without-building -project RutasTijuana.xcodeproj -scheme RutasTijuana -destination "platform=iOS Simulator,id=$SIMULATOR" -derivedDataPath "$RUNNER_TEMP/UITestBuild" -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/UITests.xcresult" CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/ui-tests.log"
      - name: Capturas y resumen
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/UITests.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/UITests.xcresult" > "$RUNNER_TEMP/ui-summary.json"
          fi
          python3 scripts/ci_ui_summary.py "$RUNNER_TEMP/ui-summary.json" "$GITHUB_STEP_SUMMARY" "${{ matrix.device }}"
      - name: Exportar capturas
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/UITests.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/UITests.xcresult" --output-path "$RUNNER_TEMP/ui-captures"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: iPhone-summary-${{ matrix.device }}
          path: ${{ runner.temp }}/ui-summary.json
          overwrite: true
          retention-days: 7
      - id: elapsed
        if: always()
        env:
          STARTED: ${{ steps.begin.outputs.started }}
        run: echo "seconds=$(($(date +%s)-STARTED))" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: iPhone-tests-${{ matrix.device }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/UITests.xcresult
            ${{ runner.temp }}/ui-*.log
            ${{ runner.temp }}/ui-summary.json
            ${{ runner.temp }}/ui-captures
          retention-days: 7


  result:
    name: Resultado
    needs: [changes, web, native, ui]
    if: ${{ !cancelled() && inputs.mode != 'walking' && inputs.mode != 'package' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.ui.result != 'skipped' }}
        with:
          pattern: iPhone-summary-*
          path: ${{ runner.temp }}/ui-reports
      - name: Diagnóstico de interfaz
        if: ${{ !cancelled() && needs.ui.result != 'skipped' }}
        run: python3 scripts/ci_ui_summary.py "$RUNNER_TEMP/ui-reports" "$GITHUB_STEP_SUMMARY"
      - name: Resumen
        if: always()
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_summary.py
