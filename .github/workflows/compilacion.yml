name: Compilación iPhone

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compilar
        run: |
          set -o pipefail
          xcodebuild -project RutasTijuana.xcodeproj -scheme RutasTijuana -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/Build" CATALOG_FIXTURE=YES CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build 2>&1 | tee "$RUNNER_TEMP/build.log"
          python3 scripts/check_app_bundle.py "$RUNNER_TEMP/Build/Build/Products/Release-iphoneos/RutasTijuana.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Build/Build/Products/Release-iphoneos/RutasTijuana.app" "$RUNNER_TEMP/RutasTijuana.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: RutasTijuana
          path: ${{ runner.temp }}/RutasTijuana.zip
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: Compilación
          path: ${{ runner.temp }}/build.log
          retention-days: 7
